<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<base target="_top">
<style>
  :root { --ink:#1c2430; --mute:#667085; --line:#d8dde6; --bg:#f4f6f9; --card:#fff; --pri:#1f5fbf; --ok:#177245; --warn:#b45309; --bad:#b42318; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: "Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif; color:var(--ink); background:var(--bg); font-size:15px; }
  header { background:var(--ink); color:#fff; padding:10px 16px; display:flex; align-items:center; gap:12px; }
  header h1 { font-size:17px; margin:0; flex:1; }
  header button { background:transparent; color:#fff; border:1px solid #ffffff66; }
  nav { display:flex; background:var(--card); border-bottom:1px solid var(--line); overflow-x:auto; }
  nav button { border:0; background:none; padding:12px 16px; font-size:15px; color:var(--mute); border-bottom:3px solid transparent; border-radius:0; white-space:nowrap; }
  nav button.on { color:var(--pri); border-bottom-color:var(--pri); font-weight:700; }
  main { max-width:960px; margin:0 auto; padding:16px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:16px; margin-bottom:16px; }
  h2 { font-size:16px; margin:0 0 12px; }
  label { display:block; font-size:13px; color:var(--mute); margin-bottom:4px; }
  input, select, textarea { width:100%; padding:9px 10px; border:1px solid var(--line); border-radius:7px; font:inherit; background:#fff; color:var(--ink); }
  textarea { min-height:64px; resize:vertical; }
  .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:12px; }
  .full { grid-column:1/-1; }
  button { font:inherit; padding:9px 14px; border-radius:7px; border:1px solid var(--line); background:#fff; color:var(--ink); cursor:pointer; }
  button.pri { background:var(--pri); border-color:var(--pri); color:#fff; font-weight:700; }
  button.danger { color:var(--bad); border-color:var(--bad); }
  button:disabled { opacity:.5; cursor:wait; }
  .row { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
  .payrow { display:grid; grid-template-columns:1.2fr 1fr 1.4fr auto; gap:8px; margin-bottom:8px; }
  table { width:100%; border-collapse:collapse; }
  th, td { text-align:left; padding:8px 6px; border-bottom:1px solid var(--line); vertical-align:top; }
  th { font-size:13px; color:var(--mute); font-weight:500; }
  td.num, th.num { text-align:right; font-variant-numeric:tabular-nums; }
  tr.click { cursor:pointer; } tr.click:hover { background:#f0f5ff; }
  .tag { display:inline-block; padding:2px 8px; border-radius:99px; font-size:12px; font-weight:700; background:#e8ebf0; }
  .tag.s-有效 { background:#dcfce7; color:var(--ok); } .tag.s-已作廢 { background:#fee4e2; color:var(--bad); }
  .tag.s-已退訂 { background:#fef0c7; color:var(--warn); } .tag.over { background:#fee4e2; color:var(--bad); }
  .big { font-size:26px; font-weight:800; letter-spacing:.5px; }
  .stats { display:grid; grid-template-columns:repeat(auto-fit,minmax(130px,1fr)); gap:10px; margin:12px 0; }
  .stat { border:1px solid var(--line); border-radius:8px; padding:10px; } .stat b { display:block; font-size:19px; }
  .mute { color:var(--mute); font-size:13px; } .scroll { overflow-x:auto; }
  #toast { position:fixed; left:50%; bottom:24px; transform:translateX(-50%); background:var(--ink); color:#fff; padding:10px 18px; border-radius:8px; display:none; z-index:99; max-width:90vw; }
  #toast.err { background:var(--bad); }
  #login { max-width:340px; margin:12vh auto; }
  .hide { display:none !important; }
  #receipt { display:none; }
  @media (max-width:560px) { .payrow { grid-template-columns:1fr 1fr; } }
  @media print {
    body { background:#fff; } body > *:not(#receipt) { display:none !important; }
    #receipt { display:block; padding:8mm; font-size:13px; } #receipt h2 { font-size:20px; text-align:center; }
    #receipt td, #receipt th { padding:5px 4px; } #receipt .sign { margin-top:14mm; display:flex; gap:20mm; }
  }
</style>
</head>
<body>
<div id="login" class="card">
  <h2 id="loginTitle">訂金管理</h2>
  <div style="margin-bottom:12px"><label>人員</label><select id="lgName"></select></div>
  <div style="margin-bottom:12px"><label>PIN</label><input id="lgPin" type="password" inputmode="numeric" autocomplete="off" maxlength="8"></div>
  <button class="pri" id="lgBtn" style="width:100%">登入</button>
  <p class="mute" id="lgMsg">載入中…</p>
</div>

<div id="app" class="hide">
  <header><h1 id="shop"></h1><span id="who"></span><button id="logout">登出</button></header>
  <nav id="tabs">
    <button data-tab="new" class="on">新增訂金</button><button data-tab="search">查詢</button>
    <button data-tab="open">未結訂金</button><button data-tab="daily">日結報表</button>
  </nav>
  <main>
    <section id="t-new">
      <div class="card"><h2>新增訂金單</h2>
        <div class="grid">
          <div><label>客戶姓名 *</label><input id="nCustomer"></div>
          <div><label>電話 *</label><input id="nPhone" inputmode="tel"></div>
          <div class="full"><label>商品內容 *（品名／尺寸／顏色／數量）</label><textarea id="nItems"></textarea></div>
          <div><label>商品總價（未定可留 0）</label><input id="nTotal" type="number" min="0" step="1"></div>
          <div><label>預計到貨日</label><input id="nExpected" type="date"></div>
          <div><label>保留期限</label><input id="nHold" type="date"></div>
          <div class="full"><label>備註</label><input id="nNote"></div>
        </div>
        <h2 style="margin-top:16px">收款（可多筆不同支付方式）</h2>
        <div id="nPays"></div>
        <div class="row"><button id="nAddPay">＋ 增加一筆收款</button><span class="mute">訂金合計：<b id="nSum">0</b></span></div>
        <div style="margin-top:16px"><button class="pri" id="nSubmit">建立訂金單</button></div>
      </div>
    </section>
    <section id="t-search" class="hide">
      <div class="card"><div class="row">
        <input id="sQ" placeholder="單號／姓名／電話／商品／POS 單號" style="flex:1;min-width:180px">
        <select id="sStatus" style="width:auto"><option value="">全部狀態</option><option>有效</option><option>已結案</option><option>已退訂</option><option>已作廢</option></select>
        <button class="pri" id="sBtn">查詢</button></div>
        <div id="sOut" class="scroll" style="margin-top:12px"></div></div>
    </section>
    <section id="t-open" class="hide"><div class="card"><div class="row"><h2 style="flex:1;margin:0">未結訂金</h2><button id="oBtn">重新整理</button></div><div id="oOut"></div></div></section>
    <section id="t-daily" class="hide">
      <div class="card"><div class="row"><h2 style="margin:0">日結報表</h2><input id="dDate" type="date" style="width:auto"><button class="pri" id="dBtn">查詢</button></div>
        <div id="dOut"></div></div>
    </section>
    <section id="t-detail" class="hide"><div class="card" id="detail"></div></section>
  </main>
</div>
<div id="receipt"></div>
<div id="toast"></div>

<script>
(function () {
  var S = { token: null, user: null, cfg: null, cur: null, lastTab: 'new', reqId: null };
  var $ = function (id) { return document.getElementById(id); };
  function esc(v) { return String(v === null || v === undefined ? '' : v).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function money(n) { return '$' + Number(n || 0).toLocaleString('en-US'); }
  function newId() { return (window.crypto && crypto.randomUUID) ? crypto.randomUUID() : 'r' + Date.now() + '-' + Math.random().toString(36).slice(2, 12); }
  function toast(msg, err) { var t = $('toast'); t.textContent = msg; t.className = err ? 'err' : ''; t.style.display = 'block'; clearTimeout(toast.h); toast.h = setTimeout(function () { t.style.display = 'none'; }, err ? 5000 : 2500); }
  function call(fn) {
    var args = [].slice.call(arguments, 1);
    return new Promise(function (res, rej) {
      google.script.run.withSuccessHandler(res).withFailureHandler(function (e) {
        var m = (e && e.message) || String(e);
        if (/登入已逾時/.test(m)) showLogin();
        rej(new Error(m.replace(/^Error:\s*/, '')));
      })[fn].apply(null, args);
    });
  }
  /** 執行動作期間停用按鈕，避免重複送出。 */
  function busy(btn, p) { btn.disabled = true; return p.then(function (r) { btn.disabled = false; return r; }, function (e) { btn.disabled = false; toast(e.message, true); throw e; }); }
  function addDays(ymd, n) { var d = new Date(ymd + 'T00:00:00Z'); d.setUTCDate(d.getUTCDate() + n); return d.toISOString().slice(0, 10); }
  function methodOpts(sel) { return S.cfg.methods.map(function (m) { return '<option' + (m === sel ? ' selected' : '') + '>' + esc(m) + '</option>'; }).join(''); }

  /* ----- 登入 ----- */
  function showLogin() { S.token = null; $('app').classList.add('hide'); $('login').classList.remove('hide'); $('lgPin').value = ''; }
  call('apiBootstrap').then(function (b) {
    $('loginTitle').textContent = b.shopName; document.title = b.shopName;
    $('lgName').innerHTML = b.staff.map(function (n) { return '<option>' + esc(n) + '</option>'; }).join('');
    $('lgMsg').textContent = b.staff.length ? '' : '尚未建立人員，請先在試算表選單「訂金管理」設定。';
  }, function (e) { $('lgMsg').textContent = e.message; });
  function login() {
    busy($('lgBtn'), call('apiLogin', $('lgName').value, $('lgPin').value)).then(function (r) {
      S.token = r.token; S.user = r; S.cfg = r.settings; S.today = r.today;
      $('shop').textContent = r.settings.shopName; $('who').textContent = r.name + '（' + r.role + '）';
      $('login').classList.add('hide'); $('app').classList.remove('hide');
      $('dDate').value = r.today; resetNew(); tab('new');
    }, function () {});
  }
  $('lgBtn').onclick = login;
  $('lgPin').onkeydown = function (e) { if (e.key === 'Enter') login(); };
  $('logout').onclick = function () { call('apiLogout', S.token); showLogin(); };

  /* ----- 分頁 ----- */
  function tab(name) {
    ['new', 'search', 'open', 'daily', 'detail'].forEach(function (t) { $('t-' + t).classList.toggle('hide', t !== name); });
    [].forEach.call($('tabs').children, function (b) { b.classList.toggle('on', b.dataset.tab === name); });
    if (name !== 'detail') S.lastTab = name;
    if (name === 'open') loadOpen();
    if (name === 'daily') loadDaily();
  }
  $('tabs').onclick = function (e) { if (e.target.dataset.tab) tab(e.target.dataset.tab); };

  /* ----- 新增 ----- */
  function payRow() {
    var d = document.createElement('div'); d.className = 'payrow';
    d.innerHTML = '<select class="pm">' + methodOpts() + '</select><input class="pa" type="number" min="1" step="1" placeholder="金額">' +
      '<input class="pr" placeholder="參考號（卡號末4碼／轉帳末5碼）"><button class="pd" title="移除">✕</button>';
    $('nPays').appendChild(d);
  }
  function sumPays() { var s = 0; [].forEach.call(document.querySelectorAll('#nPays .pa'), function (i) { s += Number(i.value) || 0; }); $('nSum').textContent = money(s); }
  function resetNew() {
    ['nCustomer', 'nPhone', 'nItems', 'nTotal', 'nExpected', 'nNote'].forEach(function (id) { $(id).value = ''; });
    $('nHold').value = S.cfg.holdDays ? addDays(S.today, S.cfg.holdDays) : '';
    $('nPays').innerHTML = ''; payRow(); sumPays(); S.reqId = newId();
  }
  $('nAddPay').onclick = payRow;
  $('nPays').oninput = sumPays;
  $('nPays').onclick = function (e) { if (e.target.className === 'pd' && $('nPays').children.length > 1) { e.target.parentNode.remove(); sumPays(); } };
  $('nSubmit').onclick = function () {
    var pays = [].map.call($('nPays').children, function (r) {
      return { method: r.querySelector('.pm').value, amount: Number(r.querySelector('.pa').value), ref: r.querySelector('.pr').value };
    });
    busy($('nSubmit'), call('apiCreateDeposit', S.token, { requestId: S.reqId, customer: $('nCustomer').value, phone: $('nPhone').value,
      items: $('nItems').value, totalPrice: Number($('nTotal').value) || 0, expectedDate: $('nExpected').value,
      holdUntil: $('nHold').value, note: $('nNote').value, payments: pays })).then(function (v) {
      resetNew(); toast('已建立 ' + v.order.orderNo); showDetail(v);
    }, function () {});
  };

  /* ----- 查詢 / 未結 ----- */
  function orderTable(rows, withHold) {
    if (!rows.length) return '<p class="mute">沒有資料</p>';
    return '<table><tr><th>單號</th><th>客戶</th><th>商品</th>' + (withHold ? '<th>保留期限</th>' : '<th>狀態</th>') + '<th class="num">訂金餘額</th></tr>' +
      rows.map(function (o) {
        return '<tr class="click" data-no="' + esc(o.orderNo) + '"><td>' + esc(o.orderNo) + '</td><td>' + esc(o.customer) + '<br><span class="mute">' + esc(o.phone) + '</span></td><td>' + esc(o.items) + '</td><td>' +
          (withHold ? esc(o.holdUntil || '—') + (o.overdue ? ' <span class="tag over">逾期</span>' : '') : '<span class="tag s-' + esc(o.status) + '">' + esc(o.status) + '</span>') +
          '</td><td class="num">' + money(o.balance) + '</td></tr>';
      }).join('') + '</table>';
  }
  function openRow(e) { var tr = e.target.closest('tr[data-no]'); if (tr) call('apiGetOrder', S.token, tr.dataset.no).then(showDetail, function (er) { toast(er.message, true); }); }
  $('sOut').onclick = openRow; $('oOut').onclick = openRow;
  function search() {
    busy($('sBtn'), call('apiSearch', S.token, { q: $('sQ').value, status: $('sStatus').value })).then(function (r) {
      $('sOut').innerHTML = (r.total > r.rows.length ? '<p class="mute">共 ' + r.total + ' 筆，僅顯示最新 100 筆，請縮小條件。</p>' : '') + orderTable(r.rows);
    }, function () {});
  }
  $('sBtn').onclick = search; $('sQ').onkeydown = function (e) { if (e.key === 'Enter') search(); };
  function loadOpen() {
    busy($('oBtn'), call('apiOutstanding', S.token)).then(function (r) {
      $('oOut').innerHTML = '<div class="stats"><div class="stat"><span class="mute">未結筆數</span><b>' + r.count + '</b></div><div class="stat"><span class="mute">訂金餘額合計</span><b>' + money(r.balance) + '</b></div><div class="stat"><span class="mute">已逾保留期限</span><b>' + r.overdueCount + '</b></div></div><div class="scroll">' + orderTable(r.rows, true) + '</div>';
    }, function () {});
  }
  $('oBtn').onclick = loadOpen;

  /* ----- 日結 ----- */
  function loadDaily() {
    busy($('dBtn'), call('apiDailyReport', S.token, $('dDate').value)).then(function (r) {
      var t = r.totals;
      $('dOut').innerHTML = '<div class="stats"><div class="stat"><span class="mute">收款合計</span><b>' + money(t.inAmt) + '</b></div><div class="stat"><span class="mute">退款合計</span><b>' + money(t.outAmt) + '</b></div><div class="stat"><span class="mute">淨收</span><b>' + money(t.inAmt - t.outAmt) + '</b></div><div class="stat"><span class="mute">沖銷（轉銷售）</span><b>' + money(t.redeemed) + '</b></div><div class="stat"><span class="mute">沒收</span><b>' + money(t.forfeited) + '</b></div></div>' +
        '<h2>依支付方式（對帳用）</h2><div class="scroll"><table><tr><th>支付方式</th><th class="num">筆數</th><th class="num">收款</th><th class="num">退款</th><th class="num">淨額</th></tr>' +
        (r.methods.map(function (m) { return '<tr><td>' + esc(m.method) + '</td><td class="num">' + m.count + '</td><td class="num">' + money(m.inAmt) + '</td><td class="num">' + money(m.outAmt) + '</td><td class="num">' + money(m.inAmt - m.outAmt) + '</td></tr>'; }).join('') || '<tr><td colspan="5" class="mute">當日無收退款</td></tr>') + '</table></div>' +
        (r.voidedCount ? '<p class="mute">另有 ' + r.voidedCount + ' 筆已作廢交易未計入。</p>' : '') +
        '<h2 style="margin-top:16px">當日交易</h2><div class="scroll">' + txTable(r.txs, true) + '</div>';
    }, function () {});
  }
  $('dBtn').onclick = loadDaily;
  function txTable(txs, withNo) {
    if (!txs.length) return '<p class="mute">沒有交易</p>';
    return '<table><tr><th>時間</th>' + (withNo ? '<th>單號</th>' : '') + '<th>類型</th><th>方式</th><th class="num">金額</th><th>參考號／備註</th><th>經手人</th></tr>' +
      txs.map(function (x) {
        return '<tr' + (x.voided === '是' ? ' style="text-decoration:line-through;color:#999"' : '') + '><td>' + esc(x.time.slice(withNo ? 11 : 0, 16)) + '</td>' + (withNo ? '<td>' + esc(x.orderNo) + '</td>' : '') + '<td>' + esc(x.type) + '</td><td>' + esc(x.method) + '</td><td class="num">' + money(x.amount) + '</td><td>' + esc([x.ref, x.note].filter(String).join('／')) + '</td><td>' + esc(x.staff) + '</td></tr>';
      }).join('') + '</table>';
  }

  /* ----- 明細與操作 ----- */
  function showDetail(v) {
    S.cur = v; var o = v.order, active = o.status === '有效', mgr = S.user.isManager;
    var kv = function (k, val) { return '<div><span class="mute">' + k + '</span><br>' + (esc(val) || '—') + '</div>'; };
    $('detail').innerHTML = '<div class="row"><button id="xBack">← 返回</button><span class="big" style="flex:1">' + esc(o.orderNo) + '</span><span class="tag s-' + esc(o.status) + '">' + esc(o.status) + '</span></div>' +
      '<div class="stats"><div class="stat"><span class="mute">已收訂金</span><b>' + money(o.received) + '</b></div><div class="stat"><span class="mute">已沖銷</span><b>' + money(o.redeemed) + '</b></div><div class="stat"><span class="mute">已退款</span><b>' + money(o.refunded) + '</b></div><div class="stat"><span class="mute">已沒收</span><b>' + money(o.forfeited) + '</b></div><div class="stat"><span class="mute">訂金餘額</span><b>' + money(o.balance) + '</b></div>' +
      (o.totalPrice ? '<div class="stat"><span class="mute">取貨尚須付</span><b>' + money(o.totalPrice - o.received + o.refunded) + '</b></div>' : '') + '</div>' +
      '<div class="grid">' + kv('客戶', o.customer) + kv('電話', o.phone) + kv('商品總價', o.totalPrice ? money(o.totalPrice) : '') + kv('預計到貨日', o.expectedDate) + kv('保留期限', o.holdUntil) + kv('建立', o.createdAt + '　' + o.createdBy) + kv('POS 銷售單號', o.posNo) +
      '<div class="full"><span class="mute">商品內容</span><br>' + esc(o.items).replace(/\n/g, '<br>') + '</div><div class="full"><span class="mute">備註</span><br>' + (esc(o.note) || '—') + '</div></div>' +
      '<div class="row" style="margin:16px 0">' + (active ? '<button class="pri" data-act="redeem">取貨沖銷</button><button data-act="pay">追加訂金</button><button data-act="edit">修改資料</button>' : '') +
      (active && (mgr || !S.cfg.refundNeedsManager) ? '<button class="danger" data-act="refund">退訂</button>' : '') +
      (mgr && o.status !== '已作廢' ? '<button class="danger" data-act="void">作廢</button>' : '') + '<button data-act="print">列印收據</button></div>' +
      '<div id="actBox"></div><h2>交易明細</h2><div class="scroll">' + txTable(v.txs) + '</div>';
    tab('detail');
  }
  $('detail').onclick = function (e) {
    if (e.target.id === 'xBack') return tab(S.lastTab);
    var act = e.target.dataset && e.target.dataset.act; if (!act) return;
    if (act === 'print') return printReceipt();
    ACTIONS[act]();
  };
  /** 產生操作表單。fields: [鍵, 標籤, 型別, 預設值]；型別 method 為支付方式下拉。 */
  function form(title, fields, submitLabel, send) {
    S.reqId = newId();
    $('actBox').innerHTML = '<div class="card" style="background:#f8fafc"><h2>' + title + '</h2><div class="grid">' + fields.map(function (f) {
      var id = 'f_' + f[0], v = f[3] === undefined ? '' : f[3];
      var ctl = f[2] === 'method' ? '<select id="' + id + '">' + methodOpts(v) + '</select>' :
        f[2] === 'area' ? '<textarea id="' + id + '">' + esc(v) + '</textarea>' :
        '<input id="' + id + '" type="' + f[2] + '" value="' + esc(v) + '"' + (f[2] === 'number' ? ' min="0" step="1"' : '') + '>';
      return '<div' + (f[2] === 'area' ? ' class="full"' : '') + '><label>' + f[1] + '</label>' + ctl + '</div>';
    }).join('') + '</div><div class="row" style="margin-top:12px"><button class="pri" id="fOk">' + submitLabel + '</button><button id="fCancel">取消</button></div></div>';
    $('fCancel').onclick = function () { $('actBox').innerHTML = ''; };
    $('fOk').onclick = function () {
      var p = { orderNo: S.cur.order.orderNo, requestId: S.reqId };
      fields.forEach(function (f) { var el = $('f_' + f[0]); p[f[0]] = f[2] === 'number' ? Number(el.value) || 0 : el.value; });
      busy($('fOk'), send(p)).then(function (v) { toast('完成'); showDetail(v); }, function () {});
    };
    $('actBox').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  }
  function lastMethod() { var p = S.cur.txs.filter(function (x) { return x.type === '收款'; }); return p.length ? p[p.length - 1].method : ''; }
  var ACTIONS = {
    pay: function () { form('追加訂金', [['method', '支付方式', 'method'], ['amount', '金額', 'number'], ['ref', '參考號', 'text'], ['note', '備註', 'text']], '確認收款', function (p) { return call('apiAddPayment', S.token, p); }); },
    redeem: function () { form('取貨沖銷（訂金折抵貨款）', [['amount', '沖銷金額', 'number', S.cur.order.balance], ['posNo', 'POS 銷售單號', 'text'], ['note', '備註', 'text']], '確認沖銷', function (p) { return call('apiRedeem', S.token, p); }); },
    refund: function () { form('退訂', [['refundAmount', '退還客戶金額', 'number', S.cur.order.balance], ['forfeitAmount', '沒收金額', 'number', 0], ['method', '退款方式', 'method', lastMethod()], ['ref', '退款參考號', 'text'], ['reason', '退訂原因 *', 'text']], '確認退訂', function (p) { return call('apiRefund', S.token, p); }); },
    edit: function () { var o = S.cur.order; form('修改資料', [['customer', '客戶姓名', 'text', o.customer], ['phone', '電話', 'text', o.phone], ['totalPrice', '商品總價', 'number', o.totalPrice], ['expectedDate', '預計到貨日', 'date', o.expectedDate], ['holdUntil', '保留期限', 'date', o.holdUntil], ['note', '備註', 'text', o.note], ['items', '商品內容', 'area', o.items]], '儲存', function (p) { return call('apiUpdateOrder', S.token, p); }); },
    void: function () { form('作廢（僅用於登打錯誤，交易將不計入報表）', [['reason', '作廢原因 *', 'text']], '確認作廢', function (p) { return call('apiVoid', S.token, p); }); }
  };
  function printReceipt() {
    var o = S.cur.order, pays = S.cur.txs.filter(function (x) { return x.type === '收款' && x.voided !== '是'; });
    $('receipt').innerHTML = '<h2>' + esc(S.cfg.shopName) + '　訂金收據</h2><table>' +
      '<tr><th>單號</th><td><b>' + esc(o.orderNo) + '</b></td><th>日期</th><td>' + esc(o.createdAt.slice(0, 10)) + '</td></tr>' +
      '<tr><th>客戶</th><td>' + esc(o.customer) + '</td><th>電話</th><td>' + esc(o.phone) + '</td></tr>' +
      '<tr><th>商品內容</th><td colspan="3">' + esc(o.items).replace(/\n/g, '<br>') + '</td></tr>' +
      '<tr><th>商品總價</th><td>' + (o.totalPrice ? money(o.totalPrice) : '—') + '</td><th>預計到貨</th><td>' + (esc(o.expectedDate) || '—') + '</td></tr>' +
      '<tr><th>已收訂金</th><td><b>' + money(o.received - o.refunded) + '</b></td><th>保留期限</th><td>' + (esc(o.holdUntil) || '—') + '</td></tr>' +
      (o.totalPrice ? '<tr><th>取貨尚須付</th><td colspan="3">' + money(o.totalPrice - o.received + o.refunded) + '</td></tr>' : '') +
      '<tr><th>收款明細</th><td colspan="3">' + pays.map(function (x) { return esc(x.time.slice(0, 10)) + '　' + esc(x.method) + '　' + money(x.amount); }).join('<br>') + '</td></tr></table>' +
      '<p>' + esc(S.cfg.terms) + '</p><div class="sign"><span>經手人：' + esc(o.createdBy) + '</span><span>客戶簽名：＿＿＿＿＿＿＿＿</span></div>';
    window.print();
  }
})();
</script>
</body>
</html>
