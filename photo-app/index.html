<!doctype html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#111111">
  <title>拍照 App</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="camera-view" class="view">
    <div class="viewfinder">
      <video id="video" autoplay playsinline muted></video>
      <div id="grid" class="grid hidden"></div>
      <div id="countdown" class="countdown hidden"></div>
      <div id="flash" class="flash"></div>
      <p id="error" class="error hidden"></p>
    </div>

    <div class="filters" id="filters">
      <button data-filter="none" class="active">原圖</button>
      <button data-filter="grayscale(1)">黑白</button>
      <button data-filter="sepia(0.8)">復古</button>
      <button data-filter="saturate(1.8) contrast(1.1)">鮮豔</button>
      <button data-filter="brightness(1.15) contrast(0.9)">柔亮</button>
      <button data-filter="hue-rotate(200deg) saturate(0.8)">冷色</button>
    </div>

    <div class="toolbar top">
      <button id="btn-timer" title="倒數計時">⏱ <span id="timer-label">關</span></button>
      <button id="btn-grid" title="格線">＃ 格線</button>
    </div>

    <div class="controls">
      <button id="btn-gallery" class="thumb" title="相簿"><img id="last-thumb" alt=""></button>
      <button id="btn-shutter" class="shutter" title="拍照"></button>
      <button id="btn-switch" class="round" title="切換鏡頭">⇄</button>
    </div>
  </main>

  <section id="gallery-view" class="view hidden">
    <header>
      <button id="btn-back">← 返回</button>
      <h1>相簿 <small id="count"></small></h1>
      <span></span>
    </header>
    <div id="gallery" class="gallery"></div>
    <p id="empty" class="empty hidden">還沒有照片，回去拍一張吧！</p>
  </section>

  <dialog id="viewer">
    <img id="viewer-img" alt="">
    <div class="viewer-actions">
      <button id="btn-download">下載</button>
      <button id="btn-share">分享</button>
      <button id="btn-delete" class="danger">刪除</button>
      <button id="btn-close">關閉</button>
    </div>
  </dialog>

  <script src="app.js"></script>
</body>
</html>
